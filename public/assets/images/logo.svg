  <!-- PRO badge -->
  <rect x="238" y="24" width="58" height="25" rx="6" fill="#ea580c"/>
  <text x="267" y="41" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">PRO</text>
