      <stop offset="0%" stop-color="#ff8a1f"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <rect x="2" y="10" width="52" height="52" rx="14" fill="url(#logoGradDark)"/>
  <rect x="14" y="28" width="4" height="16" rx="2" fill="#ffffff"/>
  <rect x="22" y="22" width="4" height="28" rx="2" fill="#ffffff"/>
  <rect x="30" y="17" width="4" height="38" rx="2" fill="#ffffff"/>
  <rect x="38" y="22" width="4" height="28" rx="2" fill="#ffffff"/>
  <rect x="46" y="28" width="4" height="16" rx="2" fill="#ffffff"/>
  
  <!-- Wordmark -->
